<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Reveal Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2%;
            width: 95vw;
            height: 90vh;
            margin-bottom: 5vh;
            overflow: hidden;
        }
        .image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .block {
            position: absolute;
            background-color: gray;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5vw;
            color: white;
            border: 2px solid black;
            box-sizing: border-box;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .block.hidden {
            opacity: 0;
            transform: scale(0.5);
        }
        .image.revealed {
            opacity: 1;
        }
        #controls {
            position: fixed;
            bottom: 10px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 10px;
        }
        #left-counter, #right-counter {
            font-size: 30px;
            margin: 0 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 1px;
            border-radius: 10px;
            width: 200px; /* Fixed width for three digits */
            text-align: center;
        }
        button {
            margin: 0 5px;
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-area"></div>
    <div id="controls">
        <div id="left-counter">Revealed: 0</div>
        <button onclick="prevImage()">Previous Image</button>
        <button onclick="nextImage()">Next Image</button>
        <button id="reveal-button" onclick="sequentialReveal()">Reveal Image 1</button>
        <div id="right-counter">Remaining: 100</div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const revealButton = document.getElementById('reveal-button');
        const leftCounter = document.getElementById('left-counter');
        const rightCounter = document.getElementById('right-counter');
        const imageFolder = 'images/';
        let currentImageIndex = 0;
        let totalBlocks = 100; // Default value
        let revealedCount = 0;
        let revealTimeouts = [];

        const images = Array.from({ length: 20 }, (_, i) => `image${i + 1}.jpg`);

        function updateCounters() {
            leftCounter.innerText = `Revealed: ${revealedCount}`;
            rightCounter.innerText = `Remaining: ${totalBlocks - revealedCount}`;
        }

        function createGameContainer() {
            const gameContainer = document.createElement('div');
            gameContainer.className = 'game-container';
            const imageWrapper = document.createElement('div');
            imageWrapper.className = 'image-wrapper';
            const imageElement = document.createElement('img');
            imageElement.className = 'image';
            imageWrapper.appendChild(imageElement);
            gameContainer.appendChild(imageWrapper);
            gameArea.appendChild(gameContainer);
            return { gameContainer, imageWrapper, imageElement };
        }

        function initGame(imageSrc) {
            gameArea.innerHTML = '';
            clearRevealTimeouts();
            revealedCount = 0;
            const { gameContainer, imageWrapper, imageElement } = createGameContainer();
            imageElement.src = imageSrc;
            imageElement.onload = () => {
                const imgWidth = imageElement.width;
                const imgHeight = imageElement.height;

                const numCols = Math.ceil(Math.sqrt(100 * (imgWidth / imgHeight))); // Start with a base value (e.g., 100)
                const numRows = Math.ceil(100 / numCols);
                totalBlocks = numCols * numRows; // Update totalBlocks dynamically
                updateCounters(); // Update counters after recalculating totalBlocks

                const blockWidth = imgWidth / numCols;
                const blockHeight = imgHeight / numRows;

                imageWrapper.style.width = `${imgWidth}px`;
                imageWrapper.style.height = `${imgHeight}px`;

                let blockNumber = 1;

                for (let row = 0; row < numRows; row++) {
                    for (let col = 0; col < numCols; col++) {
                        const block = document.createElement('div');
                        block.className = 'block';
                        block.style.width = `${blockWidth}px`;
                        block.style.height = `${blockHeight}px`;
                        block.style.left = `${col * blockWidth}px`;
                        block.style.top = `${row * blockHeight}px`;
                        block.innerText = blockNumber++;
                        block.onclick = function() {
                            if (!this.classList.contains('hidden')) {
                                this.classList.add('hidden');
                                revealedCount++;
                                updateCounters();
                                imageElement.classList.add('revealed');
                            }
                        };
                        imageWrapper.appendChild(block);
                    }
                }
            };
            revealButton.innerText = `Reveal Image ${currentImageIndex + 1}`;
        }

        function prevImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                loadImage();
            }
        }

        function nextImage() {
            if (currentImageIndex < images.length - 1) {
                currentImageIndex++;
                loadImage();
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function sequentialReveal() {
            const hiddenBlocks = Array.from(document.querySelectorAll('.block:not(.hidden)'));
            shuffle(hiddenBlocks);
            hiddenBlocks.forEach((block, index) => {
                const timeout = setTimeout(() => {
                    if (!block.classList.contains('hidden')) {
                        block.classList.add('hidden');
                        revealedCount++;
                        updateCounters();
                    }
                }, index * 100);
                revealTimeouts.push(timeout);
            });
            const currentImage = document.querySelector('.image');
            currentImage.classList.add('revealed');
        }

        function clearRevealTimeouts() {
            revealTimeouts.forEach(timeout => clearTimeout(timeout));
            revealTimeouts = [];
        }

        function loadImage() {
            const imageSrc = `${imageFolder}${images[currentImageIndex]}`;
            initGame(imageSrc);
        }

        document.addEventListener('keydown', function(event) {
            if (['ArrowLeft', 'ArrowDown', 'ArrowRight', 'ArrowUp'].includes(event.code)) {
                revealRandomBlock();
            }
        });

        function revealRandomBlock() {
            const hiddenBlocks = Array.from(document.querySelectorAll('.block:not(.hidden)'));
            if (hiddenBlocks.length > 0) {
                const randomBlock = hiddenBlocks[Math.floor(Math.random() * hiddenBlocks.length)];
                randomBlock.classList.add('hidden');
                revealedCount++;
                updateCounters();
                const currentImage = document.querySelector('.image');
                currentImage.classList.add('revealed');
            }
        }

        loadImage();
    </script>
</body>
</html>
